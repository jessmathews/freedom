<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0B0E1A;
    --panel: #171C2E;
    --panel-top: #1D2236;
    --shadow-deep: #05060C;
    --gold: #E7B94A;
    --gold-bright: #F4CD6B;
    --cream: #F4F0E6;
    --periwinkle: #6E7391;

    --card-w: clamp(40px, 7.4vw, 78px);
    --card-h: clamp(56px, 10.4vw, 100px);
    --digit-fs: clamp(1.7rem, 4.6vw, 3.2rem);
    --card-gap: clamp(4px, 0.8vw, 8px);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: var(--void);
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
  }

  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(110,115,145,0.14), transparent 55%);
  }

  .star{
    position:absolute;
    background: var(--cream);
    border-radius:50%;
    opacity:0.45;
    animation-name: twinkle;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }

  @keyframes twinkle{
    0%,100%{ opacity:.12; }
    50%{ opacity:.75; }
  }

  .horizon{
    position:fixed;
    left:0; right:0; bottom:0;
    height:22vh;
    background: linear-gradient(to top, rgba(231,185,74,0.16), rgba(231,185,74,0.03) 55%, transparent);
    pointer-events:none;
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:920px;
    padding: 6vh 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--periwinkle);
    margin: 0 0 14px 0;
    opacity:0;
    animation: rise 0.7s ease-out forwards;
    animation-delay: 0.05s;
  }

  .headline{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.9rem, 5.4vw, 3.4rem);
    line-height:1.08;
    margin: 0 0 6vh 0;
    color: var(--cream);
    opacity:0;
    animation: rise 0.8s ease-out forwards;
    animation-delay: 0.15s;
  }

  .headline .i{
    font-style: italic;
    font-weight: 600;
    color: var(--gold-bright);
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .board-wrap{
    position:relative;
    opacity:0;
    animation: rise 0.8s ease-out forwards;
    animation-delay: 0.3s;
  }

  .glow-bloom{
    position:absolute;
    left:50%; top:50%;
    width: 130%;
    height: 220%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(231,185,74,0.22), transparent 68%);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }

  body.celebrate .glow-bloom{
    animation: bloomPulse 2.2s ease-in-out infinite;
  }

  @keyframes bloomPulse{
    0%,100%{ opacity:.35; transform: translate(-50%,-50%) scale(1); }
    50%{ opacity:.62; transform: translate(-50%,-50%) scale(1.07); }
  }

  .board{
    position:relative;
    z-index:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap: clamp(8px, 2vw, 20px);
    flex-wrap:wrap;
  }

  .group{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .cards{
    display:flex;
    gap: var(--card-gap);
  }

  .digit-card{
    position:relative;
    width: var(--card-w);
    height: var(--card-h);
    background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel) 100%);
    border-radius: 6px;
    box-shadow:
      0 10px 22px rgba(0,0,0,0.5),
      0 1px 0 rgba(255,255,255,0.05) inset;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 420px;
    overflow:hidden;
  }

  .digit-card::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.05) 0%,
      transparent 48%,
      rgba(0,0,0,0.28) 52%,
      rgba(0,0,0,0.4) 100%);
    z-index:2;
    pointer-events:none;
  }

  .digit-card::after{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:2px;
    background: var(--shadow-deep);
    transform: translateY(-1px);
    z-index:3;
  }

  .digit-value{
    position:relative;
    z-index:1;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: var(--digit-fs);
    font-variant-numeric: tabular-nums;
    color: var(--cream);
    transform-style:preserve-3d;
    backface-visibility:hidden;
    line-height:1;
  }

  .digit-value.flip{
    animation: flipDigit 0.5s cubic-bezier(.45,0,.2,1);
  }

  @keyframes flipDigit{
    0%{ transform: rotateX(0deg); }
    48%{ transform: rotateX(-90deg); }
    52%{ transform: rotateX(-90deg); }
    100%{ transform: rotateX(0deg); }
  }

  .colon{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: var(--digit-fs);
    color: var(--gold);
    align-self:center;
    margin-bottom: 26px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0.25; }
  }

  .label{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(0.6rem, 1.3vw, 0.72rem);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--periwinkle);
    margin-top: 12px;
  }

  .target-line{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.74rem;
    letter-spacing: 0.14em;
    color: var(--periwinkle);
    margin-top: 6vh;
    opacity:0;
    animation: rise 0.8s ease-out forwards;
    animation-delay: 0.45s;
  }

  .target-line .accent{
    color: var(--gold);
  }

  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    overflow:hidden;
  }

  .confetti-piece{
    position:absolute;
    top:-5vh;
    width:7px;
    height:13px;
    opacity:0.9;
    border-radius:2px;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  @keyframes confettiFall{
    to{ transform: translateY(112vh) rotate(320deg); opacity:0.15; }
  }

  @media (max-width: 560px){
    .board{ gap: 14px; }
    .colon{ display:none; }
    .group{ width: calc(50% - 7px); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="sky" id="sky"></div>
  <div class="horizon"></div>

  <main class="stage">
    <p class="eyebrow">Countdown to</p>
    <h1 class="headline" id="headline"><span class="i">Freedom</span> </h1>

    <div class="board-wrap">
      <div class="glow-bloom"></div>
      <div class="board" id="board"></div>
    </div>

    <p class="target-line">Target &mdash; <span class="accent">September 18, 2026</span> &middot; 00:00 local time</p>
  </main>

<script>
(function(){
  // Hardcoded target date
  var TARGET = new Date('2026-09-18T00:00:00');

  var GROUPS = [
    { id: 'days',    digits: 3, label: 'Days' },
    { id: 'hours',   digits: 2, label: 'Hours' },
    { id: 'minutes', digits: 2, label: 'Minutes' },
    { id: 'seconds', digits: 2, label: 'Seconds' }
  ];

  var digitEls = {};
  var celebrated = false;
  var timer = null;

  function buildBoard(){
    var board = document.getElementById('board');
    GROUPS.forEach(function(g, idx){
      var groupEl = document.createElement('div');
      groupEl.className = 'group';

      var cardsEl = document.createElement('div');
      cardsEl.className = 'cards';

      var spans = [];
      for (var i = 0; i < g.digits; i++){
        var card = document.createElement('div');
        card.className = 'digit-card';
        var val = document.createElement('span');
        val.className = 'digit-value';
        val.textContent = '0';
        card.appendChild(val);
        cardsEl.appendChild(card);
        spans.push(val);
      }
      digitEls[g.id] = spans;

      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = g.label;

      groupEl.appendChild(cardsEl);
      groupEl.appendChild(label);
      board.appendChild(groupEl);

      if (idx < GROUPS.length - 1){
        var colon = document.createElement('div');
        colon.className = 'colon';
        colon.textContent = ':';
        board.appendChild(colon);
      }
    });
  }

  function flipTo(span, newChar){
    if (span.textContent === newChar) return;
    span.classList.remove('flip');
    void span.offsetWidth;
    span.classList.add('flip');
    setTimeout(function(){ span.textContent = newChar; }, 250);
  }

  function setDigits(id, number){
    var spans = digitEls[id];
    var str = String(Math.max(0, number)).padStart(spans.length, '0');
    str = str.slice(-spans.length);
    for (var i = 0; i < spans.length; i++){
      flipTo(spans[i], str[i]);
    }
  }

  function buildStars(){
    var sky = document.getElementById('sky');
    var count = 60;
    for (var i = 0; i < count; i++){
      var s = document.createElement('span');
      s.className = 'star';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 70) + '%';
      var size = Math.random() * 1.6 + 0.6;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDelay = (Math.random() * 6) + 's';
      s.style.animationDuration = (3 + Math.random() * 4) + 's';
      sky.appendChild(s);
    }
  }

  function spawnConfetti(){
    var colors = ['#E7B94A', '#F4CD6B', '#F4F0E6'];
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    document.body.appendChild(layer);
    for (var i = 0; i < 32; i++){
      (function(){
        var p = document.createElement('span');
        p.className = 'confetti-piece';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        p.style.animationDelay = (Math.random() * 0.6) + 's';
        p.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
        layer.appendChild(p);
        p.addEventListener('animationend', function(){ p.remove(); });
      })();
    }
    setTimeout(function(){ layer.remove(); }, 6500);
  }

  function celebrate(){
    var headline = document.getElementById('headline');
    headline.innerHTML = 'Happy <span class="i">New</span> Year';
    document.querySelector('.eyebrow').textContent = 'It is now';
    document.body.classList.add('celebrate');
    spawnConfetti();
  }

  function render(){
    var now = new Date();
    var diff = TARGET - now;

    if (diff <= 0){
      setDigits('days', 0);
      setDigits('hours', 0);
      setDigits('minutes', 0);
      setDigits('seconds', 0);
      if (!celebrated){
        celebrated = true;
        celebrate();
      }
      if (timer) clearInterval(timer);
      return;
    }

    var totalSeconds = Math.floor(diff / 1000);
    var days = Math.floor(totalSeconds / 86400);
    var hours = Math.floor((totalSeconds % 86400) / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    setDigits('days', Math.min(days, 999));
    setDigits('hours', hours);
    setDigits('minutes', minutes);
    setDigits('seconds', seconds);
  }

  document.addEventListener('DOMContentLoaded', function(){
    buildBoard();
    buildStars();
    setTimeout(render, 300);
    timer = setInterval(render, 1000);
  });
})();
</script>
</body>
</html>
